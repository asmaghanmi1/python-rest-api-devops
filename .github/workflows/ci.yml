
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: python_rest_api_devops_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Run automated tests
        run: python -m pytest -v

      - name: Test MongoDB connection
        run: |
          python -c "from pymongo import MongoClient; client = MongoClient('mongodb://localhost:27017', serverSelectionTimeoutMS=5000); client.admin.command('ping'); print('MongoDB connection successful'); client.close()"

      - name: Build Docker image
        run: docker build -t python-rest-api-devops:ci .