<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
        }

        /* Header */

        .header {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        /* Create task */

        .create-section {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .create-section h2 {
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #555;
        }

        .btn {
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-create {
            background: #222;
            color: white;
        }

        .btn-refresh {
            background: #e9ecef;
            color: #222;
            margin-bottom: 20px;
        }

        /* Tasks */

        .tasks-section {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tasks-header h2 {
            font-size: 22px;
        }

        .task {
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .task:last-child {
            margin-bottom: 0;
        }

        .task-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .task-description {
            color: #666;
            margin-bottom: 12px;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Status */

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-todo {
            background: #eee;
            color: #444;
        }

        .status-progress {
            background: #ddd;
            color: #222;
        }

        .status-done {
            background: #222;
            color: white;
        }

        /* Actions */

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #e9ecef;
            color: #222;
        }

        .btn-delete {
            background: #222;
            color: white;
        }

        /* Message */

        #message {
            margin-top: 12px;
            font-size: 14px;
            color: #555;
        }

        /* Empty */

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .container {
                width: 95%;
                margin: 25px auto;
            }

            .task-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .tasks-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <h1>Task Manager</h1>

            <p>
                Flask REST API · MongoDB
            </p>

        </div>


        <!-- CREATE -->

        <div class="create-section">

            <h2>Create a Task</h2>

            <form id="taskForm" class="form">

                <input
                    type="text"
                    id="title"
                    placeholder="Task title"
                    required
                >

                <input
                    type="text"
                    id="description"
                    placeholder="Description"
                >

                <select id="status">

                    <option value="todo">
                        Todo
                    </option>

                    <option value="in-progress">
                        In Progress
                    </option>

                    <option value="done">
                        Done
                    </option>

                </select>

                <button
                    type="submit"
                    class="btn btn-create"
                >
                    Create Task
                </button>

            </form>

            <div id="message"></div>

        </div>


        <!-- TASKS -->

        <div class="tasks-section">

            <div class="tasks-header">

                <h2>Tasks</h2>

                <button
                    onclick="loadTasks()"
                    class="btn btn-refresh"
                >
                    Refresh
                </button>

            </div>

            <div id="taskList"></div>

        </div>

    </div>


    <script>

        // =========================================
        // CREATE TASK
        // =========================================

        document
            .getElementById("taskForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const task = {

                    title:
                        document.getElementById("title").value,

                    description:
                        document.getElementById("description").value,

                    status:
                        document.getElementById("status").value
                };


                const response = await fetch("/tasks", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(task)
                });


                const result = await response.json();


                document.getElementById("message")
                    .textContent =
                    result.message || result.error;


                if (response.ok) {

                    document
                        .getElementById("taskForm")
                        .reset();

                    loadTasks();
                }

            });


        // =========================================
        // GET TASKS
        // =========================================

        async function loadTasks() {

            const response =
                await fetch("/tasks");

            const tasks =
                await response.json();

            const taskList =
                document.getElementById("taskList");

            taskList.innerHTML = "";


            if (tasks.length === 0) {

                taskList.innerHTML = `
                    <div class="empty">
                        No tasks yet.
                    </div>
                `;

                return;
            }


            tasks.forEach(task => {

                const div =
                    document.createElement("div");

                div.className = "task";


                let statusClass = "status-todo";

                if (task.status === "in-progress") {
                    statusClass = "status-progress";
                }

                if (task.status === "done") {
                    statusClass = "status-done";
                }


                div.innerHTML = `

                    <div class="task-title">
                        ${escapeHtml(task.title)}
                    </div>

                    <div class="task-description">
                        ${escapeHtml(task.description)}
                    </div>

                    <div class="task-footer">

                        <span class="status ${statusClass}">
                            ${escapeHtml(task.status)}
                        </span>

                        <div class="actions">

                            <button
                                class="btn btn-edit"
                                onclick="editTask('${task._id}')"
                            >
                                Edit
                            </button>

                            <button
                                class="btn btn-delete"
                                onclick="deleteTask('${task._id}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>
                `;


                taskList.appendChild(div);

            });

        }


        // =========================================
        // EDIT TASK
        // =========================================

        async function editTask(id) {

            const title =
                prompt("New title:");

            if (title === null) {
                return;
            }


            const description =
                prompt("New description:");

            if (description === null) {
                return;
            }


            const status =
                prompt(
                    "Status: todo / in-progress / done"
                );

            if (status === null) {
                return;
            }


            const response =
                await fetch(`/tasks/${id}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        title: title,

                        description: description,

                        status: status

                    })
                });


            const result =
                await response.json();


            alert(result.message || result.error);


            if (response.ok) {
                loadTasks();
            }

        }


        // =========================================
        // DELETE TASK
        // =========================================

        async function deleteTask(id) {

            const confirmation =
                confirm(
                    "Are you sure you want to delete this task?"
                );


            if (!confirmation) {
                return;
            }


            const response =
                await fetch(`/tasks/${id}`, {

                    method: "DELETE"

                });


            const result =
                await response.json();


            alert(result.message || result.error);


            if (response.ok) {
                loadTasks();
            }

        }


        // =========================================
        // SECURITY
        // =========================================

        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        // =========================================
        // INITIAL LOAD
        // =========================================

        loadTasks();

    </script>

</body>

</html>
